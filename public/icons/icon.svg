<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b5c"/>
      <stop offset="100%" stop-color="#001a38"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="#0052a3" stroke-width="4" opacity="0.6"/>
  
  <!-- Molecule Graphic -->
  <g transform="translate(256, 215)">
    <!-- Hexagon ring -->
    <polygon points="0,-105 91,-52 91,52 0,105 -91,52 -91,-52" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linejoin="round"/>
    
    <!-- Central node -->
    <circle cx="0" cy="0" r="32" fill="#38bdf8"/>
    
    <!-- Internal bonds -->
    <line x1="0" y1="0" x2="0" y2="-105" stroke="#38bdf8" stroke-width="12"/>
    <line x1="0" y1="0" x2="91" y2="52" stroke="#38bdf8" stroke-width="12"/>
    <line x1="0" y1="0" x2="-91" y2="52" stroke="#38bdf8" stroke-width="12"/>
    
    <!-- Outer node vertices -->
    <circle cx="0" cy="-105" r="18" fill="#ffffff"/>
    <circle cx="91" cy="-52" r="18" fill="#ffffff"/>
    <circle cx="91" cy="52" r="18" fill="#ffffff"/>
    <circle cx="0" cy="105" r="18" fill="#ffffff"/>
    <circle cx="-91" cy="52" r="18" fill="#ffffff"/>
    <circle cx="-91" cy="-52" r="18" fill="#ffffff"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="5">RESEARCH-CHEM</text>
  <text x="256" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="22" fill="#38bdf8" text-anchor="middle" letter-spacing="4">LABORATORY UK</text>
</svg>